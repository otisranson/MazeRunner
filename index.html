<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MazeRunner</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #111; color: #eee;
    font-family: system-ui, sans-serif;
    overflow: hidden;
  }
  #app { display: flex; flex-direction: column; height: 100%; }
  #toolbar {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; background: #1b1b1f; border-bottom: 1px solid #333;
    flex-wrap: wrap;
  }
  #toolbar h1 { font-size: 16px; margin: 0 16px 0 0; font-weight: 600; letter-spacing: 0.5px; }
  select, button {
    background: #2a2a30; color: #eee; border: 1px solid #444;
    border-radius: 4px; padding: 6px 10px; font-size: 13px; cursor: pointer;
  }
  button:hover, select:hover { background: #35353d; }
  button.active { background: #3a6; border-color: #3a6; color: #051; }
  input[type="color"] {
    width: 38px; height: 30px; padding: 2px; background: #2a2a30;
    border: 1px solid #444; border-radius: 4px; cursor: pointer;
  }
  input[type="color"]:disabled { opacity: 0.4; cursor: not-allowed; }
  #stats { margin-left: auto; font-size: 12px; color: #999; }
  #intensityLabel { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #ccc; }
  #intensityLabel input[type="range"] { accent-color: #3a6; cursor: pointer; }
  #intensityValue { min-width: 88px; }
  #help { font-size: 12px; color: #888; padding: 4px 14px 0; }
  #viewWrap { position: relative; flex: 1; display: flex; align-items: center; justify-content: center; background: #000; }
  canvas#view { image-rendering: pixelated; background: #000; }
  canvas#minimap {
    position: absolute; top: 14px; right: 14px;
    background: rgba(10,10,14,0.75); border: 1px solid #444; border-radius: 4px;
  }
  #winOverlay {
    position: absolute; inset: 0; display: none;
    align-items: center; justify-content: center; flex-direction: column;
    background: rgba(0,0,0,0.75); gap: 14px;
  }
  #winOverlay h2 { font-size: 28px; margin: 0; color: #6f6; }
  #winOverlay p { margin: 0; color: #ccc; }
</style>
</head>
<body>
<div id="app">
  <div id="toolbar">
    <h1>MazeRunner</h1>
    <select id="sizeSelect">
      <option value="10">Small (10x10)</option>
      <option value="18" selected>Medium (18x18)</option>
      <option value="26">Large (26x26)</option>
      <option value="36">Huge (36x36)</option>
    </select>
    <select id="shapeSelect">
      <option value="circle">Circle</option>
      <option value="triangle">Triangle</option>
      <option value="square" selected>Square</option>
      <option value="pentagon">Pentagon</option>
      <option value="hexagon">Hexagon</option>
      <option value="heptagon">Heptagon</option>
      <option value="octagon">Octagon</option>
      <option value="nonagon">Nonagon</option>
      <option value="decagon">Decagon</option>
    </select>
    <label id="intensityLabel">Intensity
      <input type="range" id="intensityInput" min="1" max="10" value="5" step="1">
      <span id="intensityValue">5 · Moderate</span>
    </label>
    <button id="newMazeBtn">New Maze</button>
    <button id="solveBtn">Show Solution</button>
    <button id="resetBtn">Reset Position</button>
    <input type="color" id="wallColorInput" value="#4a78c8" title="Wall color">
    <button id="psychedelicBtn">Psychedelic Mode</button>
    <button id="asciiBtn">ASCII Mode</button>
    <div id="stats"></div>
  </div>
  <div id="help">Move: W/S or &uarr;/&darr; &nbsp; Turn: A/D or &larr;/&rarr; &nbsp; Strafe: Q/E</div>
  <div id="viewWrap">
    <canvas id="view" width="900" height="560"></canvas>
    <canvas id="minimap" width="220" height="220"></canvas>
    <div id="winOverlay">
      <h2>You solved the maze!</h2>
      <p id="winStats"></p>
      <button id="againBtn">Generate New Maze</button>
    </div>
  </div>
</div>
<script>
"use strict";

// ---------- maze generation (recursive backtracker) ----------

// which cells fall inside the chosen shape, tested in a [-1,1]x[-1,1] box centered on the grid
const POLY_SIDES = { triangle: 3, pentagon: 5, hexagon: 6, heptagon: 7, octagon: 8, nonagon: 9, decagon: 10 };

function insideRegularPolygon(cx, cy, k) {
  const apothem = Math.cos(Math.PI / k);
  for (let i = 0; i < k; i++) {
    const phi = -Math.PI / 2 + (i + 0.5) * (2 * Math.PI / k);
    if (cx * Math.cos(phi) + cy * Math.sin(phi) > apothem + 1e-9) return false;
  }
  return true;
}

function computeShapeMask(shape, cols, rows) {
  const mask = Array.from({ length: rows }, () => new Array(cols).fill(true));
  if (shape === "square") return mask;
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      const cx = ((x + 0.5) / cols) * 2 - 1;
      const cy = ((y + 0.5) / rows) * 2 - 1;
      mask[y][x] = shape === "circle"
        ? cx * cx + cy * cy <= 1
        : insideRegularPolygon(cx, cy, POLY_SIDES[shape]);
    }
  }
  return mask;
}

// trims the raw shape mask down to its single 4-connected blob, so discretization
// can never leave a stray floating cell the generator/raycaster would render as an
// unreachable sealed room
function largestConnectedMask(rawMask, cols, rows) {
  let seed = null;
  const cx = Math.floor(cols / 2), cy = Math.floor(rows / 2);
  if (rawMask[cy][cx]) {
    seed = { x: cx, y: cy };
  } else {
    outer:
    for (let r = 1; r < Math.max(cols, rows); r++) {
      for (let dy = -r; dy <= r; dy++) {
        for (let dx = -r; dx <= r; dx++) {
          const x = cx + dx, y = cy + dy;
          if (x >= 0 && x < cols && y >= 0 && y < rows && rawMask[y][x]) { seed = { x, y }; break outer; }
        }
      }
    }
  }

  const active = Array.from({ length: rows }, () => new Array(cols).fill(false));
  const stack = [seed];
  active[seed.y][seed.x] = true;
  while (stack.length) {
    const { x, y } = stack.pop();
    for (const [nx, ny] of [[x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]]) {
      if (nx >= 0 && nx < cols && ny >= 0 && ny < rows && rawMask[ny][nx] && !active[ny][nx]) {
        active[ny][nx] = true;
        stack.push({ x: nx, y: ny });
      }
    }
  }
  return { active, seed };
}

function generateCells(cols, rows, active, seed) {
  const cells = [];
  for (let y = 0; y < rows; y++) {
    const row = [];
    for (let x = 0; x < cols; x++) {
      row.push({ N: true, S: true, E: true, W: true, visited: false });
    }
    cells.push(row);
  }

  const inBounds = (x, y) => x >= 0 && x < cols && y >= 0 && y < rows && active[y][x];
  const neighborsOf = (x, y) => ([
    { dir: "N", opp: "S", x, y: y - 1 },
    { dir: "S", opp: "N", x, y: y + 1 },
    { dir: "E", opp: "W", x: x + 1, y },
    { dir: "W", opp: "E", x: x - 1, y },
  ]).filter(n => inBounds(n.x, n.y) && !cells[n.y][n.x].visited);

  const stack = [{ x: seed.x, y: seed.y }];
  cells[seed.y][seed.x].visited = true;
  while (stack.length) {
    const { x, y } = stack[stack.length - 1];
    const options = neighborsOf(x, y);
    if (!options.length) { stack.pop(); continue; }
    const pick = options[Math.floor(Math.random() * options.length)];
    cells[y][x][pick.dir] = false;
    cells[pick.y][pick.x][pick.opp] = false;
    cells[pick.y][pick.x].visited = true;
    stack.push({ x: pick.x, y: pick.y });
  }
  return cells;
}

// intensity is exposed as braid probability: a "perfect maze" (pure spanning tree, no
// cycles) forces exactly one route between any two cells and maximizes dead ends — the
// hardest case. Braiding knocks down a wall at some fraction of dead ends, injecting a
// cycle (a percolation-style edge back into the tree) so a wrong turn has a shortcut back
// out, which is what actually makes a maze feel easier rather than just "smaller."
function braidMaze(cells, cols, rows, active, braidChance) {
  if (braidChance <= 0) return;
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      if (!active[y][x]) continue;
      const c = cells[y][x];
      if (["N", "S", "E", "W"].filter(d => !c[d]).length !== 1) continue;
      if (Math.random() > braidChance) continue;

      const walledNeighbors = [
        { dir: "N", opp: "S", x, y: y - 1 },
        { dir: "S", opp: "N", x, y: y + 1 },
        { dir: "E", opp: "W", x: x + 1, y },
        { dir: "W", opp: "E", x: x - 1, y },
      ].filter(n => c[n.dir] && n.x >= 0 && n.x < cols && n.y >= 0 && n.y < rows && active[n.y][n.x]);
      if (!walledNeighbors.length) continue;

      const pick = walledNeighbors[Math.floor(Math.random() * walledNeighbors.length)];
      c[pick.dir] = false;
      cells[pick.y][pick.x][pick.opp] = false;
    }
  }
}

function countDeadEnds(cells, cols, rows, active) {
  let n = 0;
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      if (!active[y][x]) continue;
      const c = cells[y][x];
      if (["N", "S", "E", "W"].filter(d => !c[d]).length === 1) n++;
    }
  }
  return n;
}

// doubled-resolution wall grid so the raycaster can treat the maze like any tile map;
// cells outside the active shape are left as solid walls, which is what carves the outline
function buildTileGrid(cells, cols, rows, active) {
  const w = cols * 2 + 1, h = rows * 2 + 1;
  const grid = Array.from({ length: h }, () => new Array(w).fill(1));
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      if (!active[y][x]) continue;
      const c = cells[y][x];
      const tx = x * 2 + 1, ty = y * 2 + 1;
      grid[ty][tx] = 0;
      if (!c.E) grid[ty][tx + 1] = 0;
      if (!c.S) grid[ty + 1][tx] = 0;
    }
  }
  return { grid, w, h };
}

// entrance/exit picked as the two geometric extremes of the active shape (min/max x+y),
// generalizing the square maze's original top-left-to-bottom-right corners to any shape.
// (Deliberately not a graph-diameter search: recursive backtracker's DFS root very often
// ends up a degree-1 dead end, which kept dragging a diameter-based endpoint back to the
// generation seed — geometry avoids depending on that generation-order artifact.)
function pickExtremeCells(active, cols, rows) {
  let start = null, exit = null, startScore = Infinity, exitScore = -Infinity;
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      if (!active[y][x]) continue;
      const score = x + y;
      if (score < startScore) { startScore = score; start = { x, y }; }
      if (score > exitScore) { exitScore = score; exit = { x, y }; }
    }
  }
  return { start, exit };
}

function solvePath(cells, cols, start, goal) {
  const key = (x, y) => y * cols + x;
  const prev = new Map();
  const seen = new Set([key(start.x, start.y)]);
  const queue = [start];
  while (queue.length) {
    const cur = queue.shift();
    if (cur.x === goal.x && cur.y === goal.y) break;
    const c = cells[cur.y][cur.x];
    const steps = [];
    if (!c.N) steps.push({ x: cur.x, y: cur.y - 1 });
    if (!c.S) steps.push({ x: cur.x, y: cur.y + 1 });
    if (!c.E) steps.push({ x: cur.x + 1, y: cur.y });
    if (!c.W) steps.push({ x: cur.x - 1, y: cur.y });
    for (const n of steps) {
      const k = key(n.x, n.y);
      if (!seen.has(k)) { seen.add(k); prev.set(k, cur); queue.push(n); }
    }
  }
  const path = [goal];
  let cur = goal;
  while (!(cur.x === start.x && cur.y === start.y)) {
    cur = prev.get(key(cur.x, cur.y));
    if (!cur) return [];
    path.push(cur);
  }
  return path.reverse();
}

// ---------- state ----------

let cols, rows, cells, tileGrid, gridW, gridH, solutionPath;
let activeMask, startCell, exitCell;
let player = { x: 0, y: 0, angle: 0 };
let showSolution = false;
let mazeStartTime = 0, won = false;
let deadEndCount = 0;
const MAX_BRAID = 0.75;
const braidChanceForIntensity = (intensity) => MAX_BRAID * (10 - intensity) / 9;
const INTENSITY_LABELS = { 1: "Open", 2: "Easy", 3: "Easy", 4: "Moderate", 5: "Moderate", 6: "Tricky", 7: "Tricky", 8: "Hard", 9: "Hard", 10: "Labyrinthine" };
let wallColor = hexToRgb("#4a78c8");
let psychedelic = false;
let asciiMode = false;
let animTime = 0;

// density ramp (sparsest to densest ink) used to render wall shading as characters
const ASCII_RAMP = " .:-=+*#%@";
const CHAR_W = 10, CHAR_H = 16;

function hexToRgb(hex) {
  const v = parseInt(hex.slice(1), 16);
  return { r: (v >> 16) & 255, g: (v >> 8) & 255, b: v & 255 };
}

// overlapping sine waves in the wall's actual hit coordinates (not just its tile) give a
// smoothly flowing, liquid-looking hue field instead of a plain per-tile color shift
function psychedelicColor(hitX, hitY, dist, side) {
  const wave = Math.sin(hitX * 1.3 + animTime * 1.5)
    + Math.sin(hitY * 1.7 - animTime * 1.1)
    + Math.sin((hitX + hitY) * 0.8 + animTime * 0.6)
    + Math.sin(Math.hypot(hitX, hitY) * 1.1 - animTime * 2);
  const hue = (wave * 45 + animTime * 25 + 720) % 360;
  const shade = Math.max(0.25, 1 - dist / 14) * (side === 1 ? 0.8 : 1);
  const light = 30 + shade * 35;
  return `hsl(${hue.toFixed(1)}, 90%, ${light.toFixed(1)}%)`;
}

const viewCanvas = document.getElementById("view");
const viewCtx = viewCanvas.getContext("2d");
const mmCanvas = document.getElementById("minimap");
const mmCtx = mmCanvas.getContext("2d");
const statsEl = document.getElementById("stats");
const winOverlay = document.getElementById("winOverlay");
const winStats = document.getElementById("winStats");

function newMaze() {
  cols = rows = parseInt(document.getElementById("sizeSelect").value, 10);
  const shape = document.getElementById("shapeSelect").value;

  const rawMask = computeShapeMask(shape, cols, rows);
  const { active } = largestConnectedMask(rawMask, cols, rows);
  activeMask = active;

  const { start, exit } = pickExtremeCells(active, cols, rows);
  startCell = start;
  exitCell = exit;

  cells = generateCells(cols, rows, active, start);
  const intensity = parseInt(document.getElementById("intensityInput").value, 10);
  braidMaze(cells, cols, rows, active, braidChanceForIntensity(intensity));
  deadEndCount = countDeadEnds(cells, cols, rows, active);

  ({ grid: tileGrid, w: gridW, h: gridH } = buildTileGrid(cells, cols, rows, active));
  solutionPath = solvePath(cells, cols, start, exit);

  showSolution = false;
  document.getElementById("solveBtn").classList.remove("active");
  resetPlayer();
  won = false;
  winOverlay.style.display = "none";
  mazeStartTime = performance.now();
}

function resetPlayer() {
  player.x = startCell.x * 2 + 1.5;
  player.y = startCell.y * 2 + 1.5;
  player.angle = solutionPath.length > 1
    ? Math.atan2(solutionPath[1].y - solutionPath[0].y, solutionPath[1].x - solutionPath[0].x)
    : 0;
}

// ---------- raycasting ----------

const FOV = Math.PI / 3;
const MOVE_SPEED = 2.4;
const TURN_SPEED = 2.2;
const keys = {};

function isWall(tx, ty) {
  if (tx < 0 || ty < 0 || tx >= gridW || ty >= gridH) return true;
  return tileGrid[ty][tx] === 1;
}

function tryMove(nx, ny) {
  const r = 0.2;
  if (!isWall(Math.floor(nx + r), Math.floor(player.y + r)) &&
      !isWall(Math.floor(nx + r), Math.floor(player.y - r)) &&
      !isWall(Math.floor(nx - r), Math.floor(player.y + r)) &&
      !isWall(Math.floor(nx - r), Math.floor(player.y - r))) {
    player.x = nx;
  }
  if (!isWall(Math.floor(player.x + r), Math.floor(ny + r)) &&
      !isWall(Math.floor(player.x + r), Math.floor(ny - r)) &&
      !isWall(Math.floor(player.x - r), Math.floor(ny + r)) &&
      !isWall(Math.floor(player.x - r), Math.floor(ny - r))) {
    player.y = ny;
  }
}

function update(dt) {
  if (won) return;
  let fwd = 0, strafe = 0;
  if (keys["w"] || keys["arrowup"]) fwd += 1;
  if (keys["s"] || keys["arrowdown"]) fwd -= 1;
  if (keys["e"]) strafe += 1;
  if (keys["q"]) strafe -= 1;
  if (keys["a"] || keys["arrowleft"]) player.angle -= TURN_SPEED * dt;
  if (keys["d"] || keys["arrowright"]) player.angle += TURN_SPEED * dt;

  if (fwd !== 0 || strafe !== 0) {
    const dx = Math.cos(player.angle) * fwd + Math.cos(player.angle + Math.PI / 2) * strafe;
    const dy = Math.sin(player.angle) * fwd + Math.sin(player.angle + Math.PI / 2) * strafe;
    const len = Math.hypot(dx, dy) || 1;
    tryMove(player.x + (dx / len) * MOVE_SPEED * dt, player.y + (dy / len) * MOVE_SPEED * dt);
  }

  const cellX = Math.floor((player.x - 1) / 2), cellY = Math.floor((player.y - 1) / 2);
  if (cellX === exitCell.x && cellY === exitCell.y) {
    won = true;
    const secs = ((performance.now() - mazeStartTime) / 1000).toFixed(1);
    winStats.textContent = `Time: ${secs}s`;
    winOverlay.style.display = "flex";
  }
}

function castRay(angle) {
  const rayDirX = Math.cos(angle), rayDirY = Math.sin(angle);
  let mapX = Math.floor(player.x), mapY = Math.floor(player.y);
  const deltaDistX = rayDirX === 0 ? 1e30 : Math.abs(1 / rayDirX);
  const deltaDistY = rayDirY === 0 ? 1e30 : Math.abs(1 / rayDirY);

  let stepX, sideDistX, stepY, sideDistY;
  if (rayDirX < 0) { stepX = -1; sideDistX = (player.x - mapX) * deltaDistX; }
  else { stepX = 1; sideDistX = (mapX + 1 - player.x) * deltaDistX; }
  if (rayDirY < 0) { stepY = -1; sideDistY = (player.y - mapY) * deltaDistY; }
  else { stepY = 1; sideDistY = (mapY + 1 - player.y) * deltaDistY; }

  let side = 0;
  for (let i = 0; i < 256; i++) {
    if (sideDistX < sideDistY) { sideDistX += deltaDistX; mapX += stepX; side = 0; }
    else { sideDistY += deltaDistY; mapY += stepY; side = 1; }
    if (isWall(mapX, mapY)) break;
  }

  const perpDist = Math.max(side === 0
    ? (mapX - player.x + (1 - stepX) / 2) / rayDirX
    : (mapY - player.y + (1 - stepY) / 2) / rayDirY, 0.0001);
  return {
    dist: perpDist,
    side,
    hitX: player.x + perpDist * rayDirX,
    hitY: player.y + perpDist * rayDirY,
  };
}

function render() {
  const w = viewCanvas.width, h = viewCanvas.height;
  viewCtx.fillStyle = "#1c1e24";
  viewCtx.fillRect(0, 0, w, h / 2);
  viewCtx.fillStyle = "#08090b";
  viewCtx.fillRect(0, h / 2, w, h / 2);

  if (asciiMode) {
    viewCtx.font = `${CHAR_H - 2}px "Courier New", monospace`;
    viewCtx.textBaseline = "top";
    const charCols = Math.ceil(w / CHAR_W);
    const maxRow = Math.floor(h / CHAR_H);
    for (let col = 0; col < charCols; col++) {
      const rayAngle = player.angle - FOV / 2 + ((col + 0.5) / charCols) * FOV;
      const { dist, side, hitX, hitY } = castRay(rayAngle);
      const corrected = dist * Math.cos(rayAngle - player.angle);
      const lineHeight = Math.min(h * 2, h / corrected);
      const y0 = (h - lineHeight) / 2;
      const shade = Math.max(0.15, 1 - corrected / 14) * (side === 1 ? 0.8 : 1);

      viewCtx.fillStyle = psychedelic
        ? psychedelicColor(hitX, hitY, corrected, side)
        : `rgb(${wallColor.r * shade | 0},${wallColor.g * shade | 0},${wallColor.b * shade | 0})`;

      const density = shade * (ASCII_RAMP.length - 1);
      const rowStart = Math.max(0, Math.floor(y0 / CHAR_H));
      const rowEnd = Math.min(maxRow, Math.ceil((y0 + lineHeight) / CHAR_H));
      for (let row = rowStart; row < rowEnd; row++) {
        const dither = (col + row) % 2 === 0 ? 0.25 : -0.25;
        const idx = Math.max(0, Math.min(ASCII_RAMP.length - 1, Math.round(density + dither)));
        viewCtx.fillText(ASCII_RAMP[idx], col * CHAR_W, row * CHAR_H);
      }
    }
  } else {
    const numRays = w;
    for (let i = 0; i < numRays; i++) {
      const rayAngle = player.angle - FOV / 2 + (i / numRays) * FOV;
      const { dist, side, hitX, hitY } = castRay(rayAngle);
      const corrected = dist * Math.cos(rayAngle - player.angle);
      const lineHeight = Math.min(h * 2, h / corrected);
      const y0 = (h - lineHeight) / 2;

      if (psychedelic) {
        viewCtx.fillStyle = psychedelicColor(hitX, hitY, corrected, side);
      } else {
        const shade = Math.max(0.15, 1 - corrected / 14) * (side === 1 ? 0.8 : 1);
        viewCtx.fillStyle = `rgb(${wallColor.r * shade | 0},${wallColor.g * shade | 0},${wallColor.b * shade | 0})`;
      }
      viewCtx.fillRect(i, y0, 1, lineHeight);
    }
  }

  renderMinimap();
  statsEl.textContent = `${cols}x${rows} maze · ${deadEndCount} dead ends`;
}

function renderMinimap() {
  const w = mmCanvas.width, h = mmCanvas.height;
  mmCtx.clearRect(0, 0, w, h);
  const scale = Math.min(w / gridW, h / gridH);
  const ox = (w - gridW * scale) / 2, oy = (h - gridH * scale) / 2;

  for (let y = 0; y < gridH; y++) {
    for (let x = 0; x < gridW; x++) {
      if (tileGrid[y][x] === 1) {
        mmCtx.fillStyle = "#556";
        mmCtx.fillRect(ox + x * scale, oy + y * scale, scale + 0.5, scale + 0.5);
      }
    }
  }

  if (showSolution) {
    mmCtx.fillStyle = "#e6c94d";
    for (const c of solutionPath) {
      const tx = c.x * 2 + 1, ty = c.y * 2 + 1;
      mmCtx.fillRect(ox + tx * scale, oy + ty * scale, scale + 0.5, scale + 0.5);
    }
  }

  mmCtx.fillStyle = "#4caf50";
  mmCtx.fillRect(ox + (startCell.x * 2 + 1) * scale, oy + (startCell.y * 2 + 1) * scale, scale + 0.5, scale + 0.5);
  mmCtx.fillStyle = "#e33";
  mmCtx.fillRect(ox + (exitCell.x * 2 + 1) * scale, oy + (exitCell.y * 2 + 1) * scale, scale + 0.5, scale + 0.5);

  mmCtx.save();
  mmCtx.translate(ox + player.x * scale, oy + player.y * scale);
  mmCtx.rotate(player.angle);
  mmCtx.fillStyle = "#7cf";
  mmCtx.beginPath();
  mmCtx.moveTo(6, 0);
  mmCtx.lineTo(-4, 4);
  mmCtx.lineTo(-4, -4);
  mmCtx.closePath();
  mmCtx.fill();
  mmCtx.restore();
}

// ---------- input & loop ----------

window.addEventListener("keydown", e => { keys[e.key.toLowerCase()] = true; });
window.addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });

document.getElementById("newMazeBtn").addEventListener("click", newMaze);
document.getElementById("resetBtn").addEventListener("click", resetPlayer);
document.getElementById("againBtn").addEventListener("click", newMaze);
document.getElementById("sizeSelect").addEventListener("change", newMaze);
document.getElementById("shapeSelect").addEventListener("change", newMaze);
document.getElementById("solveBtn").addEventListener("click", (e) => {
  showSolution = !showSolution;
  e.target.classList.toggle("active", showSolution);
});
document.getElementById("wallColorInput").addEventListener("input", (e) => {
  wallColor = hexToRgb(e.target.value);
});
document.getElementById("psychedelicBtn").addEventListener("click", (e) => {
  psychedelic = !psychedelic;
  e.target.classList.toggle("active", psychedelic);
  document.getElementById("wallColorInput").disabled = psychedelic;
});
document.getElementById("asciiBtn").addEventListener("click", (e) => {
  asciiMode = !asciiMode;
  e.target.classList.toggle("active", asciiMode);
});
document.getElementById("intensityInput").addEventListener("input", (e) => {
  document.getElementById("intensityValue").textContent = `${e.target.value} · ${INTENSITY_LABELS[e.target.value]}`;
});
document.getElementById("intensityInput").addEventListener("change", newMaze);

let lastTime = performance.now();
function loop(now) {
  const dt = Math.min((now - lastTime) / 1000, 0.1);
  lastTime = now;
  animTime += dt;
  update(dt);
  render();
  requestAnimationFrame(loop);
}

newMaze();
requestAnimationFrame(loop);
</script>
